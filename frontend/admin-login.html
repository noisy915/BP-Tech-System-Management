<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP Tech | Administrator Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="brand-logo" style="margin: 0 auto 16px;">BP</div>
            <h2>BP Tech Admin</h2>
            <p>Inventory Management & Database Control</p>
        </div>

        <div id="loginAlert" style="display: none; padding: 10px 14px; background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; border-radius: 6px; color: #fca5a5; font-size: 0.85rem; margin-bottom: 18px;"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter admin username" required autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter admin password" required autocomplete="current-password">
            </div>

            <button type="submit" id="loginBtn" class="btn-primary btn-block">
                Sign In to Dashboard
            </button>
        </form>

        <div style="margin-top: 18px; padding: 12px; background: rgba(15, 23, 42, 0.6); border-radius: 6px; border: 1px dashed var(--border-color); font-size: 0.78rem; color: var(--text-muted); text-align: center;">
            <strong>Default Demo Credentials:</strong><br>
            Username: <code style="color: var(--accent-cyan);">admin</code> | Password: <code style="color: var(--accent-cyan);">admin123</code>
        </div>

        <div class="login-footer">
            <a href="index.html">← Back to Customer Catalogue</a>
        </div>
    </div>

    <!-- Scripts: [MEMBER 3: JavaScript and Frontend Integration Developer] -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
