<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BP Tech | Product Details</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .detail-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 36px;
            margin: 40px auto;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 36px;
        }
        @media (max-width: 768px) {
            .detail-card { grid-template-columns: 1fr; }
        }
        .detail-img {
            width: 100%;
            height: 340px;
            object-fit: cover;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="brand">
                <div class="brand-logo">BP</div>
                <div class="brand-text">
                    <h1>BP TECH</h1>
                    <span>Computer Shop & PC Builder</span>
                </div>
            </a>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html" class="nav-link">← Back to Catalogue</a></li>
                    <li><a href="admin-login.html" class="btn-admin">Admin Portal</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <div class="container" style="flex: 1;">
        <div class="detail-card" id="detailCard">
            <div>
                <img src="" alt="Product Image" id="detailImg" class="detail-img">
            </div>
            <div class="detail-info">
                <div class="product-sku" id="detailSku">SKU: ---</div>
                <h2 id="detailTitle" style="color: #fff; font-size: 1.8rem; margin-bottom: 12px;">Loading...</h2>
                <div style="display: flex; gap: 10px; margin-bottom: 16px;">
                    <span class="badge" id="detailCondition">New</span>
                    <span class="badge badge-category" id="detailCategory">Category</span>
                </div>
                <div class="price-value" style="font-size: 2rem; margin-bottom: 20px;" id="detailPrice">RM 0.00</div>
                <p id="detailDesc" style="color: var(--text-secondary); margin-bottom: 24px; line-height: 1.7;"></p>
                <div id="detailStock" style="margin-bottom: 24px; font-weight: 600;"></div>
                <a href="#" target="_blank" id="detailWhatsappBtn" class="btn-whatsapp-hero" style="width: 100%; justify-content: center;">
                    <span>💬</span> Enquire on WhatsApp
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts: [MEMBER 3: JavaScript and Frontend Integration Developer] -->
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/whatsapp.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');
            if (!productId) {
                window.location.href = 'index.html';
                return;
            }

            let product = null;
            try {
                product = await api.getProduct(productId);
            } catch (err) {
                console.warn("Backend API not reachable. Checking local demo store...", err);
                const localList = (function() {
                    try {
                        const stored = localStorage.getItem("bp_tech_products");
                        if (stored) return JSON.parse(stored);
                    } catch (e) {}
                    return null;
                })();

                const fallbackList = localList || [
                    {
                        product_id: 1,
                        product_name: "AMD Ryzen 5 5600",
                        sku: "CPU-AMD-5600-NEW",
                        condition: "New",
                        selling_price: "529.00",
                        description: "6 Cores, 12 Threads, Up to 4.4 GHz Max Boost, Socket AM4, PCIe 4.0 with Wraith Stealth Cooler.",
                        image_url: "https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?w=500&auto=format&fit=crop&q=60",
                        category: { category_name: "Processors" },
                        inventory: { quantity_available: 14, is_low_stock: false }
                    },
                    {
                        product_id: 2,
                        product_name: "NVIDIA GeForce RTX 3060 12GB (Used)",
                        sku: "GPU-NV-3060-USED-01",
                        condition: "Used",
                        selling_price: "980.00",
                        description: "Stress-tested pass. 12GB GDDR6 VRAM, Ray Tracing, DLSS. 1-Month Store Warranty.",
                        image_url: "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=500&auto=format&fit=crop&q=60",
                        category: { category_name: "Graphics Cards" },
                        inventory: { quantity_available: 3, is_low_stock: true }
                    },
                    {
                        product_id: 3,
                        product_name: "Kingston FURY Beast 16GB (2x8GB) DDR4 3200MHz",
                        sku: "RAM-KST-16GB-3200-NEW",
                        condition: "New",
                        selling_price: "165.00",
                        description: "High-performance low-profile heat spreader, Intel XMP 2.0 ready, AMD Ryzen compatible.",
                        image_url: "https://images.unsplash.com/photo-1562976540-1502c2145186?w=500&auto=format&fit=crop&q=60",
                        category: { category_name: "RAM" },
                        inventory: { quantity_available: 25, is_low_stock: false }
                    },
                    {
                        product_id: 4,
                        product_name: "Kingston NV2 1TB PCIe 4.0 NVMe M.2 SSD",
                        sku: "SSD-KST-NV2-1TB-NEW",
                        condition: "New",
                        selling_price: "289.00",
                        description: "Gen 4x4 NVMe PCIe speed up to 3500MB/s Read, 2100MB/s Write. 3-Year warranty.",
                        image_url: "https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?w=500&auto=format&fit=crop&q=60",
                        category: { category_name: "Storage" },
                        inventory: { quantity_available: 18, is_low_stock: false }
                    },
                    {
                        product_id: 5,
                        product_name: "Corsair CV550 550W 80 PLUS Bronze (Used)",
                        sku: "PSU-COR-CV550-USED",
                        condition: "Used",
                        selling_price: "130.00",
                        description: "Clean tested power supply with voltage tester check. 1-Month Store Warranty.",
                        image_url: "https://images.unsplash.com/photo-1587202372634-32705e3bf49c?w=500&auto=format&fit=crop&q=60",
                        category: { category_name: "Power Supplies" },
                        inventory: { quantity_available: 1, is_low_stock: true }
                    }
                ];

                product = fallbackList.find(p => p.product_id == productId);
            }

            if (!product) {
                document.getElementById('detailTitle').textContent = 'Product not found';
                return;
            }

            try {
                document.getElementById('detailTitle').textContent = product.product_name;
                document.getElementById('detailSku').textContent = `SKU: ${product.sku}`;
                document.getElementById('detailDesc').textContent = product.description || 'No description provided.';
                document.getElementById('detailPrice').textContent = `RM ${parseFloat(product.selling_price).toFixed(2)}`;
                document.getElementById('detailImg').src = product.image_url || 'https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?w=500';

                const condBadge = document.getElementById('detailCondition');
                condBadge.textContent = product.condition;
                condBadge.className = `badge ${product.condition === 'New' ? 'badge-new' : 'badge-used'}`;

                document.getElementById('detailCategory').textContent = product.category ? product.category.category_name : 'Component';

                const stockContainer = document.getElementById('detailStock');
                const qty = product.inventory ? product.inventory.quantity_available : 0;
                if (qty <= 0) {
                    stockContainer.innerHTML = '<span class="stock-out">● Out of Stock (WhatsApp for preorder)</span>';
                } else if (product.inventory && product.inventory.is_low_stock) {
                    stockContainer.innerHTML = `<span class="stock-low">● Low Stock (${qty} unit(s) remaining)</span>`;
                } else {
                    stockContainer.innerHTML = `<span class="stock-in">● In Stock (${qty} units available)</span>`;
                }

                // WhatsApp enquiry link
                const waBtn = document.getElementById('detailWhatsappBtn');
                waBtn.href = whatsapp.getProductLink(product.product_name, product.condition, product.selling_price);
            } catch (renderErr) {
                console.error(renderErr);
            }
        });
    </script>
</body>
</html>
